name: Publish APT repo (wizk)

# Publishes *.deb files built by the `Packages` workflow to the fork APT
# repository at https://wizk-modz.github.io/wizk-apt-repo/ using `aptly`:
# pool/ + dists/stable, dists/root, dists/x11 (signed Release/InRelease),
# pushed to Wizk-Modz/wizk-apt-repo (master). Each deb is routed to the
# distribution matching its source directory (packages/ -> stable,
# root-packages/ -> root, x11-packages/ -> x11).
#
# The git repo doubles as the cumulative .deb store: every publish re-adds
# all debs found under pool/ to a fresh aptly repo, so history is kept in
# git and no aptly database needs to persist between runs.
#
# Run manually from the Actions tab. Optionally pass a `Packages` workflow
# run ID to import its debs first; with an empty input the current pool
# state is simply re-published (useful for the first, possibly empty,
# publish so `apt update` works from day one).
#
# It also runs automatically after every successful `Packages` run on
# master, importing that run's debs, so merged packages reach the repo
# without manual steps. (Pushes go to wizk-apt-repo, so no loop.)

on:
  workflow_dispatch:
    inputs:
      packages_run_id:
        description: "Packages workflow run ID to import debs from (empty = republish current pool)"
        required: false
      arch:
        description: "Architecture"
        required: false
        default: "aarch64"
  workflow_run:
    workflows: ["Packages"]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'Wizk-Modz/termux-packages' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    env:
      APT_REPO: Wizk-Modz/wizk-apt-repo
      APT_REPO_BRANCH: master
    steps:
      - name: Resolve inputs
        run: |
          echo "ARCH=${{ inputs.arch || 'aarch64' }}" >> "$GITHUB_ENV"
          RUN_ID="${{ inputs.packages_run_id }}"
          if [ -z "$RUN_ID" ] && [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Importing debs from run: ${RUN_ID:-<none, republish pool>}"

      - name: Install tools
        run: |
          command -v aptly >/dev/null || sudo apt-get install -y aptly

      - name: Setup SSH for apt repo push
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.APT_REPO_DEPLOY_KEY }}" > ~/.ssh/apt_repo
          chmod 600 ~/.ssh/apt_repo
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone apt repo
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/apt_repo -o StrictHostKeyChecking=yes"
        run: |
          git clone --depth 1 --branch "$APT_REPO_BRANCH" "git@github.com:${APT_REPO}.git" apt-repo

      - name: Import debs from Packages run
        if: env.RUN_ID != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl && cd dl
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY"
          # Artifacts land in per-artifact subdirectories, so search
          # recursively for the tarballs instead of globbing top level.
          find . -name "debs-*.tar" -exec tar -xf {} \;
          mkdir -p ../incoming
          find . -name "*.deb" -exec cp -f "{}" ../incoming/ \;
          cd .. && rm -rf dl

      - name: Clone package recipes for repo mapping
        uses: actions/checkout@v7
        with:
          path: pkgsrc
          filter: blob:none
          sparse-checkout: |
            packages/*/build.sh
            packages/*/*.subpackage.sh
            root-packages/*/build.sh
            root-packages/*/*.subpackage.sh
            x11-packages/*/build.sh
            x11-packages/*/*.subpackage.sh
          sparse-checkout-cone-mode: false

      - name: Import GPG key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$PWD/.gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf "%s" "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEYID=$(gpg --batch --list-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Publish with aptly
        run: |
          set -e
          export GNUPGHOME="$PWD/.gnupg"
          mkdir -p apt-repo/pool incoming
          STAMP="$(date +%Y%m%d%H%M%S)"
          aptly repo create -distribution=stable -component=main wizk-stable
          aptly repo create -distribution=root -component=stable wizk-root
          aptly repo create -distribution=x11 -component=main wizk-x11
          # Cumulative store: re-add every deb already in the repo pool plus
          # any newly imported ones. Each deb is routed to the aptly repo
          # matching the source directory it was built from, so every
          # distribution gets its Contents metadata (required by
          # command-not-found's generate-db.js at bootstrap build time).
          STABLE_DEBS=()
          ROOT_DEBS=()
          X11_DEBS=()
          mapfile -t ALL_DEBS < <(find apt-repo/pool incoming -name "*.deb" 2>/dev/null) || true
          for deb in ${ALL_DEBS[@]+"${ALL_DEBS[@]}"}; do
            pkg="$(dpkg-deb -f "$deb" Package)"
            dist=""
            if [ -f "pkgsrc/packages/$pkg/build.sh" ]; then
              dist="stable"
              STABLE_DEBS+=("$deb")
            elif [ -f "pkgsrc/root-packages/$pkg/build.sh" ]; then
              dist="root"
              ROOT_DEBS+=("$deb")
            elif [ -f "pkgsrc/x11-packages/$pkg/build.sh" ]; then
              dist="x11"
              X11_DEBS+=("$deb")
            else
              # Subpackages (e.g. foo-dev built from foo): find the owning recipe.
              owner="$(find pkgsrc/packages pkgsrc/root-packages pkgsrc/x11-packages -maxdepth 2 -name "$pkg.subpackage.sh" -print -quit 2>/dev/null)"
              case "$owner" in
                pkgsrc/packages/*) dist="stable"; STABLE_DEBS+=("$deb");;
                pkgsrc/root-packages/*) dist="root"; ROOT_DEBS+=("$deb");;
                pkgsrc/x11-packages/*) dist="x11"; X11_DEBS+=("$deb");;
              esac
            fi
            if [ -z "$dist" ]; then
              echo "::error ::Cannot map deb '$deb' (package '$pkg') to a distribution."
              exit 1
            fi
            echo "Routing package '$pkg' -> distribution '$dist'."
          done
          # -force-replace: re-adding a deb already in the repo (normal for
          # the cumulative pool) must not fail the publish.
          # shellcheck disable=SC2068
          [ "${#STABLE_DEBS[@]}" -gt 0 ] && aptly repo add -force-replace wizk-stable ${STABLE_DEBS[@]}
          # shellcheck disable=SC2068
          [ "${#ROOT_DEBS[@]}" -gt 0 ] && aptly repo add -force-replace wizk-root ${ROOT_DEBS[@]}
          # shellcheck disable=SC2068
          [ "${#X11_DEBS[@]}" -gt 0 ] && aptly repo add -force-replace wizk-x11 ${X11_DEBS[@]}
          [ "${#ALL_DEBS[@]}" -eq 0 ] && echo "[!] Pool is empty, publishing empty repo."
          aptly snapshot create "wizk-$STAMP" from repo wizk-stable
          aptly snapshot create "wizk-$STAMP-root" from repo wizk-root
          aptly snapshot create "wizk-$STAMP-x11" from repo wizk-x11
          rm -rf publish && mkdir -p publish
          cat > aptly.conf <<EOF
          {
            "FileSystemPublishEndpoints": {
              "wizk": { "rootDir": "$PWD/publish" }
            }
          }
          EOF
          publish_snapshot() {
            local snap="$1" dist="$2" comp="$3"
            aptly -config="$PWD/aptly.conf" publish snapshot -batch -passphrase="" -gpg-key="$KEYID" \
              -origin="Wizk" -label="Wizk" -architectures="${{ env.ARCH }}" \
              -distribution="$dist" -component="$comp" \
              "$snap" filesystem:wizk:
          }
          publish_snapshot "wizk-$STAMP" stable main
          publish_snapshot "wizk-$STAMP-root" root stable
          publish_snapshot "wizk-$STAMP-x11" x11 main
          # Sync aptly output back: dists/ metadata plus the reorganized pool/
          # (which becomes the cumulative store for the next run).
          rm -rf apt-repo/dists apt-repo/pool
          cp -r publish/dists apt-repo/dists
          cp -r publish/pool apt-repo/pool
          rm -rf publish incoming .gnupg

      - name: Push to apt repo
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/apt_repo -o StrictHostKeyChecking=yes"
        run: |
          cd apt-repo
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish APT repo (${{ env.ARCH }})"
          git push origin "$APT_REPO_BRANCH"
