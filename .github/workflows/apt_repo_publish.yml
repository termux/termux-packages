name: Publish APT repo (wizk)

# Publishes *.deb files built by the `Packages` workflow to the fork APT
# repository at https://wizk-modz.github.io/wizk-apt-repo/ using `aptly`:
# pool/ + dists/stable (signed Release/InRelease), pushed to
# Wizk-Modz/wizk-apt-repo (master).
#
# The git repo doubles as the cumulative .deb store: every publish re-adds
# all debs found under pool/ to a fresh aptly repo, so history is kept in
# git and no aptly database needs to persist between runs.
#
# Run manually from the Actions tab. Optionally pass a `Packages` workflow
# run ID to import its debs first; with an empty input the current pool
# state is simply re-published (useful for the first, possibly empty,
# publish so `apt update` works from day one).

on:
  workflow_dispatch:
    inputs:
      packages_run_id:
        description: "Packages workflow run ID to import debs from (empty = republish current pool)"
        required: false
      arch:
        description: "Architecture"
        required: false
        default: "aarch64"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'Wizk-Modz/termux-packages'
    env:
      APT_REPO: Wizk-Modz/wizk-apt-repo
      APT_REPO_BRANCH: master
    steps:
      - name: Install tools
        run: |
          command -v aptly >/dev/null || sudo apt-get install -y aptly

      - name: Setup SSH for apt repo push
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.APT_REPO_DEPLOY_KEY }}" > ~/.ssh/apt_repo
          chmod 600 ~/.ssh/apt_repo
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone apt repo
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/apt_repo -o StrictHostKeyChecking=yes"
        run: |
          git clone --depth 1 --branch "$APT_REPO_BRANCH" "git@github.com:${APT_REPO}.git" apt-repo

      - name: Import debs from Packages run
        if: inputs.packages_run_id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dl && cd dl
          gh run download "${{ inputs.packages_run_id }}" --repo "$GITHUB_REPOSITORY"
          for t in debs-*.tar; do
            [ -e "$t" ] || continue
            tar xf "$t"
          done
          mkdir -p ../incoming
          find . -name "*.deb" -exec cp -f "{}" ../incoming/ \;
          cd .. && rm -rf dl

      - name: Import GPG key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$PWD/.gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf "%s" "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEYID=$(gpg --batch --list-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')" >> "$GITHUB_ENV"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Publish with aptly
        run: |
          set -e
          export GNUPGHOME="$PWD/.gnupg"
          mkdir -p apt-repo/pool incoming
          SNAPSHOT="wizk-$(date +%Y%m%d%H%M%S)"
          aptly repo create -distribution=stable -component=main wizk-stable
          # Cumulative store: re-add every deb already in the repo pool plus
          # any newly imported ones.
          mapfile -t ALL_DEBS < <(find apt-repo/pool incoming -name "*.deb" 2>/dev/null) || true
          if [ "${#ALL_DEBS[@]}" -gt 0 ]; then
            # shellcheck disable=SC2068
            aptly repo add wizk-stable ${ALL_DEBS[@]}
          else
            echo "[!] Pool is empty, publishing empty repo."
          fi
          aptly snapshot create "$SNAPSHOT" from repo wizk-stable
          rm -rf publish && mkdir -p publish
          cat > aptly.conf <<EOF
          {
            "FileSystemPublishEndpoints": {
              "wizk": { "rootDir": "$PWD/publish" }
            }
          }
          EOF
          aptly -config="$PWD/aptly.conf" publish snapshot -batch -passphrase="" -gpg-key="$KEYID" \
            -origin="Wizk" -label="Wizk" -architectures="${{ inputs.arch }}" \
            "$SNAPSHOT" filesystem:wizk:
          # Sync aptly output back: dists/ metadata plus the reorganized pool/
          # (which becomes the cumulative store for the next run).
          rm -rf apt-repo/dists apt-repo/pool
          cp -r publish/dists apt-repo/dists
          cp -r publish/pool apt-repo/pool
          rm -rf publish incoming .gnupg

      - name: Push to apt repo
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/apt_repo -o StrictHostKeyChecking=yes"
        run: |
          cd apt-repo
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to publish."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Publish APT repo (${{ inputs.arch }})"
          git push origin "$APT_REPO_BRANCH"
