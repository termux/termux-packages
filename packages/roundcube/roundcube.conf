Alias /roundcube @TERMUX_PREFIX@/share/roundcube/public_html

<Directory @TERMUX_PREFIX@/share/roundcube/public_html>
    Options FollowSymLinks
    DirectoryIndex index.php
    Require all granted

    # PHP 8+
    <IfModule mod_php.c>
        php_value error_reporting "E_ALL & ~E_DEPRECATED"
        php_value include_path .
        php_admin_value open_basedir @TERMUX_PREFIX@/share/roundcube:@TERMUX_PREFIX@/etc/roundcube:@TERMUX_PREFIX@/var/lib/roundcube:@TERMUX_PREFIX@/var/log/roundcube:/tmp
        php_admin_value upload_tmp_dir @TERMUX_PREFIX@/var/lib/roundcube/temp
        php_admin_value session.save_path @TERMUX_PREFIX@/var/lib/roundcube/sessions
    </IfModule>

</Directory>

# Disallow web access to directories that don't need it
<Directory @TERMUX_PREFIX@/share/roundcube/config>
    Require all denied
</Directory>
<Directory @TERMUX_PREFIX@/share/roundcube/temp>
    Require all denied
</Directory>
<Directory @TERMUX_PREFIX@/share/roundcube/logs>
    Require all denied
</Directory>
<Directory @TERMUX_PREFIX@/share/roundcube/SQL>
    Require all denied
</Directory>
<Directory @TERMUX_PREFIX@/share/roundcube/vendor>
    Require all denied
</Directory>
<Directory @TERMUX_PREFIX@/share/roundcube/installer>
    Require all denied
</Directory>
